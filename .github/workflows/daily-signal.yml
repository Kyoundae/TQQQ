name: TQQQ 매수/매도 신호 체크

on:
  # cron-job.org(외부 스케줄러)가 GitHub API를 통해 workflow_dispatch로
  # 이 워크플로를 정확한 시각(06:35 KST)에 실행시킵니다.
  # GitHub Actions 자체 schedule 트리거는 큐 지연이 심해 제거했습니다 —
  # 시간을 바꾸고 싶으면 이 파일이 아니라 cron-job.org 대시보드에서
  # 스케줄만 바꾸면 됩니다 (CRONJOB_ORG_가이드.md 참고).
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능, cron-job.org도 이 트리거를 호출함

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세 갱신 + 신호 계산 + 알림 발송
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scripts/update_and_notify.py

      - name: 앱용 데이터 파일 생성 (data.json)
        run: python scripts/export_app_data.py

      - name: 변경사항 커밋 (price_history.json, state.json, data.json)
        run: |
          git config user.name "tqqq-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json state.json data.json
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 시세/신호 자동 업데이트 $(date +%Y-%m-%d)"
          git push
