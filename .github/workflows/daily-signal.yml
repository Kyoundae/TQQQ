name: TQQQ 매수/매도 신호 체크

on:
  schedule:
    # 05:47 KST = 20:47 UTC (전날)
    # 정각(00분)은 전 세계에서 가장 몰리는 예약 시간대라 GitHub 큐가 밀려
    # 실행이 크게 지연되는 경우가 많습니다. 정각을 피한 47분으로 잡아서
    # 큐 혼잡을 줄이고, 06:00 전에 데이터가 준비되도록 여유를 뒀습니다.
    # (GitHub Actions의 schedule 트리거는 "정확한 시각 보장"이 아니라
    # "그 시각 이후 가능한 빨리 실행"이라는 점을 참고해주세요.)
    - cron: "47 20 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세 갱신 + 신호 계산 + 알림 발송
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scripts/update_and_notify.py

      - name: 앱용 데이터 파일 생성 (data.json)
        run: python scripts/export_app_data.py

      - name: 변경사항 커밋 (price_history.json, state.json, data.json)
        run: |
          git config user.name "tqqq-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json state.json data.json
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 시세/신호 자동 업데이트 $(date +%Y-%m-%d)"
          git push
